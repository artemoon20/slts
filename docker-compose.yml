version: '3.8'

services:
  # Development service
  slts-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run start -- --host 0.0.0.0 --port 4200

  # Production service
  slts-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production

  # Nginx for production (alternative)
  slts-nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./dist/slts:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - slts-prod
