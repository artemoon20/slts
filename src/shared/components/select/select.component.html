<div class="select-container">
  <label *ngIf="label" class="select-label">{{ label }}<span *ngIf="required" class="required">*</span></label>
  
  <div class="select-wrapper" 
       [class.select-wrapper--error]="error"
       [class.select-wrapper--disabled]="disabled"
       [class.select-wrapper--open]="isOpen">
    
    <div class="select-trigger" 
         (click)="toggleDropdown()"
         tabindex="0">
      
      <span class="select-value" 
            [class.select-value--placeholder]="!selectedValue">
        {{ getSelectedLabel() }}
      </span>
      
      <span class="select-arrow" 
            [class.select-arrow--open]="isOpen">
        ▼
      </span>
    </div>
    
    <div class="select-dropdown" 
         *ngIf="isOpen"
         (click)="$event.stopPropagation()">
      
      <div class="select-option" 
           *ngFor="let option of options"
           [class.select-option--disabled]="option.disabled"
           [class.select-option--selected]="option.value === selectedValue"
           (click)="selectOption(option)">
        {{ option.label }}
      </div>
      
      <div *ngIf="options.length === 0" class="select-no-options">
        No options available
      </div>
    </div>
  </div>
</div>
