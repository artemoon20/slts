<div class="sign-up-form">
    <app-auth-form-header [title]="title" [subtitle]="subtitle" [link]="link" />
    <form class="sign-up-form__form-body" [formGroup]="form">
        <div class="sign-up-form__field-wrapper">
            <input class="sign-up-form__field" formControlName="email" name="email" type="text" placeholder="Email">
            <span class="sign-up-form__error-message" *ngIf="emailControl.errors">{{ emailControl.errors['errorMessage'] }}</span>
        </div>
        <div class="sign-up-form__field-wrapper">
            <input class="sign-up-form__field" formControlName="name" name="name" type="text" placeholder="Name">
            <span class="sign-up-form__error-message" *ngIf="nameControl.errors">{{ nameControl.errors['errorMessage'] }}</span>
        </div>
        <div class="sign-up-form__field-wrapper">
            <div class="sign-up-form__passwords-wrapper">
                <div class="sign-up-form__password-container sign-up-form__password-wrapper">
                    <input class="sign-up-form__field" formControlName="password" name="password" type="password" placeholder="Password">
                    <span class="sign-up-form__error-message" *ngIf="passwordControl.errors">{{ passwordControl.errors['errorMessage'] }}</span>
                </div>
                <div class="sign-up-form__password-container sign-up-form__repeat-password-wrapper">
                    <input class="sign-up-form__field" formControlName="repeatPassword" name="repeatPassword" type="password" placeholder="Repeat">
                    <span class="sign-up-form__error-message" *ngIf="repeatPassword.errors">{{ repeatPassword.errors['errorMessage'] }}</span>
                </div>
            </div>
        </div>
        <button type="submit" class="sign-up-form__submit-btn" (click)="formSubmit()">Proceed</button>
    </form>
</div>
