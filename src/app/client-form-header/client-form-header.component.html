<div class="client-form-header">
    <div class="client-form-header__title-wrapper">
        <h1 class="client-form-header__title">{{ title }}</h1>
        <span class="client-form-header__subtitle" *ngIf="subtitle">{{ subtitle }}</span>
    </div>
    <fa-icon [icon]="faTimes" class="client-form-header__close-icon" (click)="closeModal()" />
</div>
