<div class="edit-client">
    @if (isLoading()) {
        <app-loader />
    }
    @else {
        <app-client-form 
            [formHeaderTitle]="formHeaderTitle" 
            [cancelButtonText]="'Cancel'"
            [confirmButtonText]="'Save Changes'"
            [userData]="user"
            (closeModalEmitter)="closeModal()"
            (onClientFormSubmit)="updateUser($event)"
            [isLoading]="isLoading()"
        />
    }
</div>
